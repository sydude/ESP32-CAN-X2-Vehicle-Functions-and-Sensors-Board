name: ESP-IDF 6.1 build and decoder tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  host-decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native decoder vectors
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/main firmware/main/haltech_protocol.cpp firmware/tests/test_protocol.cpp -o /tmp/test_protocol
          /tmp/test_protocol

  esp32s3:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        working-directory: firmware
        shell: bash
        run: |
          idf.py set-target esp32s3
          idf.py build
