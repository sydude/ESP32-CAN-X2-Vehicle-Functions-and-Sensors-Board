[platformio]
default_envs = simulator

[common]
lib_deps =
    lvgl/lvgl@^9.4.0
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
monitor_speed = 115200

[env:esp32canx2]
platform = espressif32
framework = arduino
board = freenove_esp32_s3_wroom
monitor_speed = ${common.monitor_speed}
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    ${common.build_flags}
    -D APP_TARGET_ESP32=1
    # -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
build_src_filter =
    +<*>
    -<sim_main.cpp>
    -<hal/platform_hal_sim.cpp>

[env:simulator]
platform = native
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D APP_TARGET_SIM=1
    -D LV_USE_OS=LV_OS_NONE
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -Wl,-rpath,/opt/homebrew/lib
    -lSDL2
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal/platform_hal_esp32.cpp>
lib_ldf_mode = deep+